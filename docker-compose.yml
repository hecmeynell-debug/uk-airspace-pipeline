# Phase 0: PostgreSQL only. Ingestion, Airflow and dbt services are added in
# later phases so that the foundation stays independently verifiable.
services:
  postgres:
    image: postgres:16-alpine
    container_name: airspace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-airspace}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - copy .env.example to .env}
      AIRSPACE_OWNER_PASSWORD: ${AIRSPACE_OWNER_PASSWORD:?set in .env}
      AIRSPACE_INGEST_PASSWORD: ${AIRSPACE_INGEST_PASSWORD:?set in .env}
      AIRSPACE_TRANSFORM_PASSWORD: ${AIRSPACE_TRANSFORM_PASSWORD:?set in .env}
      AIRSPACE_READER_PASSWORD: ${AIRSPACE_READER_PASSWORD:?set in .env}
      # Deterministic collation and UTC everywhere; all timestamps are stored
      # as timestamptz and reasoned about in UTC.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      TZ: UTC
      PGTZ: UTC
    ports:
      # Loopback-only: the database is never exposed on the host's LAN address.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Named volume, not a bind mount. A bind mount into a OneDrive-synced
      # directory corrupts Postgres data files; a named volume lives inside the
      # Docker VM and is unaffected by file sync.
      - postgres_data:/var/lib/postgresql/data
      # Runs once, only when the data directory is empty.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-airspace} -q"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    # Modest, explicit limits so the local footprint is predictable.
    shm_size: 256mb

  # Read API and dashboard. Small enough to belong in the base stack, so
  # `docker compose up` produces something you can actually look at. Airflow
  # stays an overlay because it is five more containers.
  dashboard:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: uk-airspace-api:local
    container_name: airspace-dashboard
    restart: unless-stopped
    environment:
      # Note what is absent: no owner, ingest or transform password. This
      # container is given the reader credential and nothing else, so it
      # cannot reach raw, staging or intermediate even if asked to.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-airspace}
      AIRSPACE_READER_PASSWORD: ${AIRSPACE_READER_PASSWORD:?set in .env}
      # Only used to describe the region in /api/meta.
      OPENSKY_LAT_MIN: ${OPENSKY_LAT_MIN:-49.0}
      OPENSKY_LAT_MAX: ${OPENSKY_LAT_MAX:-61.0}
      OPENSKY_LON_MIN: ${OPENSKY_LON_MIN:--10.0}
      OPENSKY_LON_MAX: ${OPENSKY_LON_MAX:-3.0}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-120}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    name: airspace_postgres_data
