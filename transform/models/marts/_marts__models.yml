version: 2

models:
  - name: fct_airspace_activity_hourly
    description: >
      Observed traffic density per hour, grid cell and altitude band. Counts of
      observations and distinct airframes - never identities, never tracks.
      Describes what the OpenSky receiver network observed, which is not the
      same as what flew; see the Limitations section of the README.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [activity_hour, grid_lat, grid_lon, altitude_band]
    columns:
      - name: activity_hour
        data_tests: [not_null]
      - name: grid_lat
        data_tests: [not_null]
      - name: grid_lon
        data_tests: [not_null]
      - name: altitude_band
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['ground', 'below_10k', '10k_to_24k', '24k_to_35k', 'above_35k', 'unknown']
      - name: observation_count
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 1, inclusive: true}
      - name: distinct_aircraft
        description: >
          count(distinct icao24) within the bucket. An aggregate measure of how
          many airframes contributed; the identities do not survive the group by.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 1, inclusive: true}
      - name: contributing_run_count
        description: How many ingestion runs contributed to this bucket.
        data_tests: [not_null]
      - name: last_ingested_at
        data_tests: [not_null]

  - name: fct_airspace_activity_daily
    description: >
      Daily traffic profile by altitude band, with a coverage measure. Built
      from the intermediate model rather than rolled up from the hourly mart,
      because distinct airframe counts cannot be summed across hours.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [activity_date, altitude_band]
    columns:
      - name: activity_date
        data_tests: [not_null]
      - name: altitude_band
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['ground', 'below_10k', '10k_to_24k', '24k_to_35k', 'above_35k', 'unknown']
      - name: observation_count
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 1, inclusive: true}
      - name: distinct_aircraft
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 1, inclusive: true}
      - name: distinct_grid_cells
        description: How widely spread the traffic was. A coverage measure, not a location.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 1, inclusive: true}
