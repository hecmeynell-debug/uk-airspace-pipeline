[project]
name = "uk-airspace-pipeline"
version = "0.1.0"
description = "Ingestion and transformation of public ADS-B data for aggregate UK airspace analysis"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "tenacity>=8.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.5",
]
transform = [
    "dbt-core>=1.9",
    "dbt-postgres>=1.9",
]

[project.scripts]
airspace-ingest = "ingestion.run:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ingestion*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    # These truncate raw.state_vectors, so they refuse to run against a
    # populated database unless AIRSPACE_ALLOW_DESTRUCTIVE_TESTS=1.
    "integration: requires a live Postgres; destructive to the raw schema",
]
filterwarnings = ["error::DeprecationWarning"]
