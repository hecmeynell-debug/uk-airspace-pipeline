[project]
name = "uk-airspace-pipeline"
version = "0.1.0"
description = "Ingestion and transformation of public ADS-B data for aggregate UK airspace analysis"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "tenacity>=8.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.5",
]
transform = [
    "dbt-core>=1.9",
    "dbt-postgres>=1.9",
]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg-pool>=3.2",
]

[project.scripts]
airspace-ingest = "ingestion.run:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ingestion*", "api*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency and parameter markers are calls in argument defaults by
# design; B008 is a false positive for them, not a finding.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Header"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    # These truncate raw.state_vectors, so they refuse to run against a
    # populated database unless AIRSPACE_ALLOW_DESTRUCTIVE_TESTS=1.
    "integration: requires a live Postgres; destructive to the raw schema",
]
# Our own deprecations stay fatal. Third-party ones we cannot fix are ignored
# individually rather than by relaxing the rule, so a new one still surfaces.
filterwarnings = [
    "error::DeprecationWarning",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning",
]
